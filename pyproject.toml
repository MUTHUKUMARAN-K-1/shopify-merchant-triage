[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-merchant-triage"
version = "0.1.0"
description = "LangGraph entry node for Shopify merchant support routing"
requires-python = ">=3.11"
dependencies = ["langgraph==1.2.20", "httpx==0.28.1", "pydantic==2.14.2"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
merchant-triage = "merchant_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
